
# COLIEE legal document retrieval preprocessing
# Baseline configuration

cleaning:
  remove_math: false
  remove_urls: false
  remove_citations: false

tokenizer:
  lowercase: true
  split_underscores: true
  min_token_length: 1
  drop_numeric: false

  stopwords:
    source: none
    extra: []
    keep: []

  stemming: none